name: flashdial
description: "FlashDial Your smart dialing assistant that seamlessly connects your mobile phone with your desktop for effortless call management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_database: ^13.1.0
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^16.0.0
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
